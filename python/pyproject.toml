[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recast"
version = "0.1.0"
description = "Photo -> 3D scene pipeline for the recast renderer"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.8",
    "pillow>=10.0",
    "trimesh>=4.0",
]

[project.optional-dependencies]
raw = ["rawpy>=0.19"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["recast*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

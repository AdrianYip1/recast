[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recast"
version = "0.1.0"
description = "Photo -> 3D scene pipeline for the recast renderer"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.8",
    "pillow>=10.0",
    "trimesh>=4.0",
    "scikit-image>=0.22",
    "scipy>=1.11",
    "shapely>=2.0",
    "mapbox-earcut>=1.0",
]

[project.optional-dependencies]
raw = ["rawpy>=0.19"]
lens = ["lensfunpy>=1.15"]
dev = ["pytest>=8.0", "jsonschema>=4.0"]
# `python -m recast detect` and `recast.object --mode generated` (pretrained models, run offline).
# `recast.object --mode generated` (TripoSR, vendored in third_party/TripoSR) also needs these.
# GPU: install the CUDA build of torch first (see README); on the CPU it works, much slower
models = ["torch>=2.2", "torchvision>=0.17", "transformers>=4.45", "omegaconf>=2.3", "einops>=0.7",
          "xatlas>=0.0.9", "fast_simplification>=0.1"]

[project.scripts]
recast = "recast.cli:main"

[tool.setuptools.packages.find]
include = ["recast*"]

[tool.setuptools.package-data]
"recast.object" = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
